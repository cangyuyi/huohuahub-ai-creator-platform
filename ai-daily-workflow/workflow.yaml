    - data:
        code: |
          import json
          import re

          def main(llm_output: str) -> dict:
              # Extract JSON from markdown code block if present
              json_match = re.search(r'```json\s*(.*?)\s*```', llm_output, re.DOTALL)
              if json_match:
                  json_str = json_match.group(1)
              else:
                  # Try to find JSON object directly
                  json_match = re.search(r'\{.*\}', llm_output, re.DOTALL)
                  if json_match:
                      json_str = json_match.group(0)
                  else:
                      json_str = llm_output

              data = json.loads(json_str)
              panels = data.get('panels', [])

              prompts = []
              for i in range(4):
                  if i < len(panels):
                      prompts.append(panels[i].get('image_prompt', ''))
                  else:
                      prompts.append('')

              return {
                  "panel1_prompt": prompts[0],
                  "panel2_prompt": prompts[1],
                  "panel3_prompt": prompts[2],
                  "panel4_prompt": prompts[3],
                  "comic_data": json.dumps(data, ensure_ascii=False)
              }
        code_language: python3
        outputs:
          panel1_prompt:
            children: null
            type: string
          panel2_prompt:
            children: null
            type: string
          panel3_prompt:
            children: null
            type: string
          panel4_prompt:
            children: null
            type: string
          comic_data:
            children: null
            type: string
