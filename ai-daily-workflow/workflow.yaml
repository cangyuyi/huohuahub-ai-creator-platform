    - data:
        code: |
          import json
          import re

          def main(comic_data: str, img1: str, img2: str, img3: str, img4: str) -> dict:
              data = json.loads(comic_data)
              title = data.get('title', 'AI新闻')
              summary = data.get('plain_summary', '')
              impact = data.get('impact', '')
              panels = data.get('panels', [])

              # Extract image URLs from tool outputs
              image_urls = []
              for img_text in [img1, img2, img3, img4]:
                  url = extract_url(img_text)
                  image_urls.append(url)

              dialogues = []
              narrations = []
              for i in range(4):
                  if i < len(panels):
                      dialogues.append(panels[i].get('dialogue', ''))
                      narrations.append(panels[i].get('narration', ''))
                  else:
                      dialogues.append('')
                      narrations.append('')

              result_text = f"【{title}】\n📰 {summary}\n💡 {impact}\n"
              for i in range(4):
                  result_text += f"\n第{i+1}格：{dialogues[i]}"
                  if narrations[i]:
                      result_text += f"（{narrations[i]}）"

              return {
                  "result": result_text,
                  "img1_url": image_urls[0] or '',
                  "img2_url": image_urls[1] or '',
                  "img3_url": image_urls[2] or '',
                  "img4_url": image_urls[3] or '',
                  "dialogues": json.dumps(dialogues, ensure_ascii=False),
                  "narrations": json.dumps(narrations, ensure_ascii=False)
              }

          def extract_url(text: str) -> str:
              if not text:
                  return ''
              url_match = re.search(r'https?://[^\s\)"\'>\]]+\.(?:png|jpg|jpeg|webp)', text, re.IGNORECASE)
              if url_match:
                  return url_match.group(0)
              url_match = re.search(r'https?://[^\s\)"\'>\]]+', text)
              if url_match:
                  return url_match.group(0)
              return ''
        code_language: python3
        outputs:
          result:
            children: null
            type: string
          img1_url:
            children: null
            type: string
          img2_url:
            children: null
            type: string
          img3_url:
            children: null
            type: string
          img4_url:
